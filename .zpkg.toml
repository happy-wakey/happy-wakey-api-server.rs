[package]
org = "happy-wakey"
name = "happy-wakey-api-server"
version = "0.1.0"
description = "Contract-first Happy Wakey JSON API backed by SeaORM"
license = "MIT"
keywords = ["alarms", "axum", "seaorm", "shared-auth", "sync"]

[package.repository]
vcs = "git"
url = "https://github.com/happy-wakey/happy-wakey-api-server.rs"

[dependencies]
"flags-2-env/flags-2-env" = "^0.3.0"
"happy-wakey/happy-wakey-lib-core" = "^0.1.0"
"happy-wakey/happy-wakey-orm-core" = "^0.1.0"
"happy-wakey/happy-wakey-interfaces" = "^0.1.0"
"oresoftware/ores-middleware" = "^0.1.0"
"oresoftware/next-loggers-rust" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[targets.repository]
dir = "."
adapter = "rust"

[scripts]
test = "cargo test --locked"
